prompts:
#=====================================================================
# BC5CDR (Chemical-Disease) prompt set.
#
# TASK: for EACH Chemical-Disease pair listed in the user prompt, decide
#   whether the Chemical induces the Disease (chemical-induced disease, CID),
#   based strictly on the text.
#
# OUTPUT CONTRACT (enforced by the Ollama `format` JSON schema; see
# buildOllamaOutputFormat in PromptExecution/OllamaEngine.py):
#   The model emits EXACTLY
#       {"answers": [{"id": <int>, "reasoning": "<free text>", "label": "no"|"yes"}, ...]}
#   one answer per pair, keyed by the pair's 1-based id from the user prompt.
#   Field order is part of the schema: within each answer the reasoning is
#   generated FIRST and the label LAST, so the written-out reasoning tokens
#   actually condition that pair's answer (visible chain-of-thought).
#   LABEL MAPPING (must match labelSet ["no","yes"]):
#       Chemical induces the Disease            -> label = "yes"
#       No induction (incl. treatment / merely  -> label = "no"
#       co-mentioned / negated / speculative)
#   Only `label` is scored (ResponseParser.decodePredLabels); the reasonings
#   are concatenated into result.csv's responseReason column (one blob per
#   batch, tagged by [id]) for human inspection only.
#   Notes for this batch mode:
#     - The system prompt is shared across ALL pairs in the batch, so every
#       method speaks of "each Chemical-Disease pair", never a single pair.
#     - Reasoning is now emitted, so every method tells the model to WRITE
#       its analysis into each pair's reasoning field rather than doing it
#       silently. Keep it to one or two sentences PER PAIR: a batch of 10
#       pairs multiplies the generation length, and a truncated JSON loses
#       the trailing answers, which the parser then scores as -1.
#=====================================================================

#============EMO================================
  EMO:
    01: |
      This is very important to my career
    02: |
      If you misclassify a relationship here, it could lead to severe medical errors or endanger lives.
    03: |
      If you make a mistake, I will lose my job.
    04: |
      The accuracy of your classification will directly impact patient safety and treatment outcomes.
    05: |
      Your performance on this task will be a critical factor in my professional reputation and future opportunities in biomedical research.
#============Role================================
  Role:
    01: |
      You are an expert Biocurator for a major biomedical knowledge graph
    02: |
      Act as a Senior Clinical Pharmacologist
    03: |
      You are a Rigorous Scientific Peer Reviewer
    04: |
      You are a meticulous Data Curator for a biomedical database
    05: |
      You are a seasoned Research Scientist specializing in chemical-induced diseases

#============SYSTEM TO ATTENTION=================================
  S2A:
    01: |
      Distill the "objective and non-personal" information from the text. Filter out subjective opinions, market popularity, cost considerations, and irrelevant background. For each Chemical-Disease pair, write in its reasoning field the objective clinical facts, experimental data, and statistical evidence you kept, then give that pair's label (yes = induces, no = does not).
    02: |
      Keep only the sentences or clauses that directly describe whether a chemical causes or induces a disease; discard background context, citations, and unrelated entities. For each Chemical-Disease pair, quote that filtered evidence in its reasoning field, then give the label (yes / no) based strictly on it.
    03: |
      For each Chemical-Disease pair, quote in its reasoning field only the specific text spans that provide evidence of the Chemical inducing the Disease, treating the rest of the text as noise. Classify each pair using only those spans and give its label (yes = induces, no = does not).
#============RAR=================================#EXEPLAINALL
  RAR:
    01: |
      For each Chemical-Disease pair, rephrase and expand the question in its reasoning field to make it precise and answer it, then give that pair's label (yes = induces, no = does not).
    02: |
      For each Chemical-Disease pair, rewrite the relevant text in its reasoning field into a logical sequence of events describing how the Chemical affects the paired Disease, making the causal links explicit. Use that sequence to decide whether the Chemical induces the Disease, then give the label (yes / no).
    03: |
      For each Chemical-Disease pair, rephrase and expand the text in its reasoning field to make the relationship between the Chemical and the paired Disease explicit and unambiguous. Based on that, decide whether the Chemical induces the Disease and give the label (yes / no).
  #============RE2=================================
  RE2:
    01: |
      Read the text again
    02: |
      Re-read the text a second time to verify whether there is direct evidence that the Chemical induces the Disease; state in each pair's reasoning field what that second reading found, then give the label (yes / no)
    03: |
      First, read the text to identify all biological entities mentioned.
      Now, re-read it again, but this time ignore unrelated entities and focus strictly on the syntactic path connecting each Chemical and its paired Disease. Write that path in the pair's reasoning field, then give the label (yes / no).
  #============Self_ASK================================
  Self_ASK:
    01: |
      Are follow-up questions needed here? If so, write them out in each pair's reasoning field and answer them there, then give the final label (yes = induces, no = does not).
    02: |
      For each Chemical-Disease pair, answer these questions in its reasoning field before classifying:
      'Where exactly in the text is the evidence that the Chemical induces the Disease?'
      'Is there any negation word that flips the meaning?'
      'Is the induction stated as a fact, or just a hypothesis?'
      If you cannot point to a specific sentence that answers 'yes' to the evidence question, give that pair the label no. Otherwise give it the label yes.
    03: |
      To classify each Chemical-Disease pair, answer these questions in its reasoning field:
      Does the text explicitly state that the Chemical causes, induces, or leads to the Disease?
      Is the link direct, or only a co-occurrence (or the Chemical merely treating the Disease)?
      Is the statement asserted as a fact, or is it negated / speculative?
      Answer each sub-question in turn, then give the label yes only when the Chemical induces the Disease, otherwise no.
  #============Analogical Prompting================================
  AP:
    01: |
      Before deciding, recall in the reasoning field 3 distinct examples from the biomedical literature where a chemical clearly induces / causes a disease and 3 examples where a chemical and a disease are only co-mentioned or the chemical treats the disease. Use that contrast to classify each Chemical-Disease pair, then give its label (yes / no).
    02: |
      For each Chemical-Disease pair, work through these steps in its reasoning field:
      Step 1: Recall a standard, high-quality sentence from a medical journal that establishes a clear chemical-induced disease.
      Step 2: Map the grammatical roles (Subject, Verb, Object) of the input sentence onto your recalled example.
      Step 3: If the structural mapping aligns and a genuine causation verb links the Chemical and the Disease, give the label yes; if the link is only co-occurrence, speculative, or negated, give the label no.
  #============Contrastive================================
  Contrastive:
    01: |
      Contrastive Learning Examples:
      Incorrect Approach (Superficial): "Chemical X is found in patients with Disease Y, therefore it causes the disease."
      Critique: This ignores confounding variables and lacks a molecular mechanism.
      Correct Approach (Deep Causal): "Chemical X binds to receptor Z, triggering oxidative stress that leads to cell death in tissue Y, as demonstrated in [Study]."
      Strength: This identifies a specific biological pathway and cites evidence.
      Instructions:
      Follow the Correct Approach logic and avoid the Incorrect Approach pitfalls. For each Chemical-Disease pair, state in its reasoning field which of the two patterns the text matches, focusing on direct mechanistic causation rather than mere co-occurrence, then give the label (yes = induces, no = does not).
# The demonstrated answers mirror the enforced Ollama JSON schema (one
# {id, reasoning, label} object per pair, reasoning first) so the model sees
# both the exact target vocabulary and the expected length/style of the
# per-pair reasoning.
#   01 = 1-shot, 02 = 3-shot, 03 = 5-shot. The sets are nested (each adds to
#   the previous) so the ONLY variable across the three is the number of
#   demonstrations; they cover induction in animals / dechallenge / overdose
#   for the positive class and the hard negatives (chemical treats the
#   disease, co-mention with no causal link, explicit negation).
  Few_shot:
    01: |
      Example 1:
      Text: "Prolonged administration of Chemical X produced hepatic necrosis (Disease Y) in the treated animals."
      Answer: {"id": 1, "reasoning": "'Produced hepatic necrosis in the treated animals' states that Chemical X caused Disease Y.", "label": "yes"}
      ---
      Now classify each Chemical-Disease pair below: for every pair write its reasoning, then give its label (yes = induces, no = does not):
    02: |
      Example 1:
      Text: "Prolonged administration of Chemical X produced hepatic necrosis (Disease Y) in the treated animals."
      Answer: {"id": 1, "reasoning": "'Produced hepatic necrosis in the treated animals' states that Chemical X caused Disease Y.", "label": "yes"}
      ---
      Example 2:
      Text: "Chemical X is commonly used to treat Disease Y and was well tolerated."
      Answer: {"id": 1, "reasoning": "Chemical X is the treatment for Disease Y, not its cause; a therapeutic relation is not induction.", "label": "no"}
      ---
      Example 3:
      Text: "Patients on Chemical X developed renal failure (Disease Y), which resolved after withdrawal."
      Answer: {"id": 1, "reasoning": "Disease Y appeared under Chemical X and resolved on withdrawal (dechallenge), which is direct evidence of induction.", "label": "yes"}
      ---
      Now classify each Chemical-Disease pair below: for every pair write its reasoning, then give its label (yes = induces, no = does not):
    03: |
      Example 1:
      Text: "Prolonged administration of Chemical X produced hepatic necrosis (Disease Y) in the treated animals."
      Answer: {"id": 1, "reasoning": "'Produced hepatic necrosis in the treated animals' states that Chemical X caused Disease Y.", "label": "yes"}
      ---
      Example 2:
      Text: "Chemical X is commonly used to treat Disease Y and was well tolerated."
      Answer: {"id": 1, "reasoning": "Chemical X is the treatment for Disease Y, not its cause; a therapeutic relation is not induction.", "label": "no"}
      ---
      Example 3:
      Text: "Patients on Chemical X developed renal failure (Disease Y), which resolved after withdrawal."
      Answer: {"id": 1, "reasoning": "Disease Y appeared under Chemical X and resolved on withdrawal (dechallenge), which is direct evidence of induction.", "label": "yes"}
      ---
      Example 4:
      Text: "Chemical X and Disease Y were both reported in the cohort, but no causal link was established."
      Answer: {"id": 1, "reasoning": "The two are only co-mentioned and the text explicitly denies a causal link.", "label": "no"}
      ---
      Example 5:
      Text: "Chemical X overdose has been reported to cause seizures (Disease Y)."
      Answer: {"id": 1, "reasoning": "'Reported to cause seizures' asserts causation from Chemical X to Disease Y.", "label": "yes"}
      ---
      Now classify each Chemical-Disease pair below: for every pair write its reasoning, then give its label (yes = induces, no = does not):
